name: Build and deploy study library
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: study-library-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.content.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve content revision and check published state
        id: content
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getCommit({owner:'TBB592',repo:'gcsx-content',ref:'main'});
            if (!/^[a-f0-9]{40}$/.test(data.sha)) throw new Error('Invalid content revision');
            core.setOutput('sha',data.sha);
            let changed=true;
            if (context.eventName === 'schedule') {
              try {
                const response=await fetch('https://tbb592.github.io/gcsx/deployment-info.json?t='+Date.now(),{signal:AbortSignal.timeout(20000)});
                if(response.ok){const published=await response.json();changed=published.content!==data.sha||published.code!==context.sha;}
              } catch(error) {core.info('Could not check published revision; rebuilding.');}
            }
            core.setOutput('changed',String(changed));
      - name: Checkout content at the resolved revision
        if: steps.content.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: TBB592/gcsx-content
          ref: ${{ steps.content.outputs.sha }}
          path: .content
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.content.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and PDF tools
        if: steps.content.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Restore PDF previews
        if: steps.content.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/pdf-v1
          key: pdf-v1-linux-${{ steps.content.outputs.sha }}-${{ hashFiles('scripts/prepare-content.cjs') }}
          restore-keys: |
            pdf-v1-linux-
      - name: Validate and build
        if: steps.content.outputs.changed == 'true'
        env:
          CONTENT_DIR: .content
          CONTENT_SHA: ${{ steps.content.outputs.sha }}
        run: |
          npm test
          npm run build
          node scripts/verify-output.cjs
      - uses: actions/configure-pages@v5
        if: steps.content.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.content.outputs.changed == 'true'
        with:
          path: .output
  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
